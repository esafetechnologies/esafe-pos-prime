name: Server Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-tests:
    name: Frappe / ERPNext v16
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=2s
          --health-retries=3
          --tmpfs=/var/lib/mysql:rw,noexec,nosuid,size=2g

    steps:
      - name: Clone
        uses: actions/checkout@v6

      - name: Find tests
        run: |
          echo "Finding tests"
          grep -rn "def test" pos_prime/tests > /dev/null

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          check-latest: true

      - name: Install MariaDB client
        run: |
          sudo apt-get update
          sudo apt-get install --yes mariadb-client

      - name: Initialize bench
        run: |
          pip install frappe-bench
          bench init \
            --frappe-branch version-16 \
            --skip-redis-config-generation \
            --skip-assets \
            --python "$(which python)" \
            ~/frappe-bench
          mariadb --host 127.0.0.1 --port 3306 -u root -proot \
            -e "SET GLOBAL character_set_server = 'utf8mb4'"
          mariadb --host 127.0.0.1 --port 3306 -u root -proot \
            -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"

      - name: Install ERPNext and POS Prime
        working-directory: /home/runner/frappe-bench
        env:
          CI: "Yes"
        run: |
          bench get-app --branch version-16 erpnext
          bench get-app pos_prime "$GITHUB_WORKSPACE"
          bench setup requirements --dev
          bench new-site \
            --db-root-password root \
            --admin-password admin \
            test_site
          bench --site test_site install-app erpnext
          bench --site test_site install-app pos_prime
          bench build --app pos_prime

      - name: Run server tests
        working-directory: /home/runner/frappe-bench
        env:
          TYPE: server
        run: |
          bench --site test_site set-config allow_tests true
          bench --site test_site run-tests --app pos_prime

