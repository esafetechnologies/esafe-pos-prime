exclude: 'node_modules|\.git|pos_prime/public/frontend/'
default_stages: [pre-commit]
fail_fast: false


repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        files: "pos_prime.*"
        exclude: ".*json$|.*txt$|.*csv|.*md|.*svg"
      - id: check-merge-conflict
      - id: check-ast
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.10
    hooks:
      - id: ruff
        name: "Run ruff import sorter"
        args: ["--select=I", "--fix"]
        stages: [manual]

      - id: ruff
        name: "Run ruff linter"
        args: ["--ignore=I"]

      - id: ruff-format
        name: "Run ruff formatter"
        stages: [manual]

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v2.7.1
    hooks:
      - id: prettier
        types_or: [javascript, vue, scss]
        stages: [manual]
        # Ignore any files that might contain jinja / bundles
        exclude: |
            (?x)^(
                pos_prime/public/frontend/.*|
                .*node_modules.*|
                .*boilerplate.*|
                pos_prime/templates/includes/.*|
                pos_prime/public/js/lib/.*
            )$


  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v8.44.0
    hooks:
      - id: eslint
        types_or: [javascript]
        args: ['--quiet']
        # Ignore any files that might contain jinja / bundles
        exclude: |
            (?x)^(
                pos_prime/public/frontend/.*|
                cypress/.*|
                .*node_modules.*|
                .*boilerplate.*|
                pos_prime/templates/includes/.*|
                pos_prime/public/js/lib/.*
            )$

ci:
    autoupdate_schedule: weekly
    skip: []
    submodules: false
